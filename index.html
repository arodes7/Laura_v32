<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Laura v32.0.0 — Galleria privata</title>
    <meta name="description" content="Colección privada de 32 features para Laura v32.0.0">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="hero">
      <div class="hero-inner">
        <p class="eyebrow">birthday release · private gallery</p>
        <h1>Laura v32.0.0</h1>
        <p class="subtitle">Una colección privada de 32 features, obras, pistas y regalos</p>
        <div class="terminal-line" aria-hidden="true">
          <span>&gt;</span> initializing birthday protocol<span class="cursor">_</span>
        </div>
        <div id="stats" class="stats" aria-label="Resumen de features"></div>
      </div>
    </header>

    <main>
      <section class="toolbar" aria-label="Filtros de features">
        <div class="filters">
          <button class="active" data-filter="todos">todos</button>
          <button data-filter="regalos">regalos</button>
          <button data-filter="mensajes">mensajes</button>
          <button data-filter="bromas">bromas</button>
          <button data-filter="pistas">pistas</button>
        </div>
        <label class="search-label">
          <span>buscar</span>
          <input id="search" type="search" placeholder="feature, obra, pista...">
        </label>
      </section>

      <section id="cards" class="cards" aria-live="polite"></section>
    </main>

    <dialog id="featureModal" class="modal">
      <button id="closeModal" class="close" type="button" aria-label="Cerrar">×</button>
      <div id="modalBody"></div>
    </dialog>

    <footer>
      <p>release built with love · blame policy: consultar feature #26</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
